<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board Operator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 25px;
        min-height: 100vh;
        background: #130d09;
        color: #e6c994;
        font-family: Georgia, serif;
      }

      main {
        max-width: 500px;
        margin: 40px auto;
      }

      h1 {
        font-size: 24px;
        letter-spacing: 4px;
        font-weight: normal;
      }

      p {
        color: #a9906c;
        line-height: 1.6;
      }

      #status {
        margin: 35px 0 15px;
        padding: 15px;
        border: 1px solid #80603b;
        color: #d7b77e;
        letter-spacing: 2px;
        font-size: 13px;
      }

      input {
        width: 100%;
        padding: 18px;
        background: #251910;
        border: 1px solid #80603b;
        color: #f0d8aa;
        font-size: 18px;
        outline: none;
        margin-top: 15px;
      }

      button {
        width: 100%;
        padding: 18px;
        margin-top: 15px;
        background: #8b6840;
        border: 1px solid #c5a36c;
        color: #fff0d1;
        font-family: Georgia, serif;
        font-size: 15px;
        letter-spacing: 2px;
      }

      button:disabled {
        opacity: 0.35;
      }

      #answerArea {
        display: none;
      }

      .hint {
        font-size: 12px;
      }

      /* Presence toggle */
      .presence {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 25px;
        padding: 14px 16px;
        border: 1px solid #80603b;
      }

      .presence-label {
        letter-spacing: 2px;
        font-size: 13px;
      }

      #presenceButton {
        width: auto;
        margin-top: 0;
        padding: 10px 18px;
        background: #3a2a1a;
        border: 1px solid #80603b;
        color: #d7b77e;
      }

      #presenceButton.online {
        background: #2e5a2e;
        border-color: #6fbf6f;
        color: #e8ffe8;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>BOARD OPERATOR</h1>

      <p>
        Enter the answer you want the board to reveal. The visitor will only see
        the projected response.
      </p>

      <div class="presence">
        <span class="presence-label">I AM PRESENT</span>
        <button id="presenceButton">OFFLINE</button>
      </div>

      <div id="status">WAITING FOR A QUESTION</div>

      <section id="answerArea">
        <label for="answer">YOUR RESPONSE</label>

        <input
          id="answer"
          type="text"
          maxlength="50"
          placeholder="Enter a response..."
          autocomplete="off"
        />

        <p class="hint">
          Letters, numbers and spaces only. Maximum 50 characters.
        </p>

        <button id="sendButton">SEND TO THE BOARD</button>
      </section>
    </main>

    <script type="module" src="volunteer.js"></script>
  </body>
</html>
