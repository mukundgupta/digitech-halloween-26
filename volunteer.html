<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board Operator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        background: #1b1b1b;
        color: #e8e8e8;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      main {
        max-width: 500px;
        margin: 30px auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
      }

      p {
        color: #aaa;
        line-height: 1.5;
        font-size: 14px;
      }

      #status {
        margin: 20px 0 15px;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #242424;
        color: #ccc;
        font-size: 14px;
      }

      label {
        display: block;
        font-size: 13px;
        color: #aaa;
        margin-top: 10px;
      }

      input {
        width: 100%;
        padding: 14px;
        background: #242424;
        border: 1px solid #555;
        border-radius: 6px;
        color: #fff;
        font-size: 16px;
        outline: none;
        margin-top: 8px;
      }

      input:focus {
        border-color: #888;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #454545;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      #answerArea {
        display: none;
      }

      .hint {
        font-size: 12px;
        color: #888;
      }

      /* Presence toggle */
      .presence {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
        padding: 12px 14px;
        border: 1px solid #444;
        border-radius: 6px;
      }

      .presence-label {
        font-size: 14px;
        color: #ccc;
      }

      #presenceButton {
        width: auto;
        margin-top: 0;
        padding: 8px 16px;
        background: #3a3a3a;
      }

      #presenceButton.online {
        background: #2e7d32;
        border-color: #4caf50;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Board Operator</h1>

      <p>
        Type the answer the board will reveal. Toggle yourself online so the
        board waits for you instead of answering on its own.
      </p>

      <div class="presence">
        <span class="presence-label">Present / answering</span>
        <button id="presenceButton">OFFLINE</button>
      </div>

      <div id="status">WAITING FOR A QUESTION</div>

      <section id="answerArea">
        <label for="answer">YOUR RESPONSE</label>

        <input
          id="answer"
          type="text"
          maxlength="50"
          placeholder="Enter a response..."
          autocomplete="off"
        />

        <p class="hint">
          Letters, numbers and spaces only. Maximum 50 characters.
        </p>

        <button id="sendButton">SEND TO THE BOARD</button>
      </section>
    </main>

    <script type="module" src="volunteer.js"></script>
  </body>
</html>
