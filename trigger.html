<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speak to the Board</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #130d09;
        color: #e6c994;
        font-family: Georgia, serif;
        text-align: center;
      }

      main {
        width: 100%;
        padding: 30px;
      }

      h1 {
        font-size: 25px;
        letter-spacing: 5px;
        font-weight: normal;
      }

      p {
        color: #a9906c;
        line-height: 1.7;
      }

      /* The one main action button (big circular). */
      #mainButton {
        display: block;
        width: min(75vw, 280px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid #c5a36c;
        background: radial-gradient(circle, #65472e, #26180f);
        color: #f0d8aa;
        font-family: Georgia, serif;
        font-size: 21px;
        letter-spacing: 2px;
        box-shadow: 0 0 35px #9a6b3830;
        margin: 25px auto;
        transition: opacity 0.3s;
      }

      #mainButton:active {
        transform: scale(0.96);
        background: #80603b;
      }

      #mainButton:disabled {
        opacity: 0.4;
      }

      /* Small "summon again" button shown during the reveal. */
      #smallButton {
        display: none;
        width: auto;
        padding: 12px 22px;
        border-radius: 24px;
        border: 1px solid #8a6b45;
        background: #251910;
        color: #d7b77e;
        font-family: Georgia, serif;
        font-size: 13px;
        letter-spacing: 2px;
        margin: 20px auto 0;
        cursor: pointer;
      }

      #smallButton:active {
        transform: scale(0.96);
      }

      #status {
        font-size: 13px;
        letter-spacing: 2px;
        color: #c5a36c;
      }

      /* Screens: only one is visible at a time */
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }

      #revealText {
        margin-top: 40px;
        font-size: 30px;
        letter-spacing: 6px;
        min-height: 40px;
        color: #f0d8aa;
        text-shadow: 0 0 18px #c48e45;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <main>
      <!-- Screen 1: ask (summon / finish speaking) -->
      <section id="askScreen" class="screen active">
        <h1>THE BOARD IS WAITING</h1>

        <p>
          Press to summon the spirit, speak your question aloud,<br />
          then press "FINISH SPEAKING".
        </p>

        <button id="mainButton">SUMMON<br />THE SPIRIT</button>

        <div id="status">READY</div>
      </section>

      <!-- Screen 2: waiting + answer reveal -->
      <section id="revealScreen" class="screen">
        <h1>THE SPIRIT STIRS</h1>
        <div id="revealText"></div>

        <!-- Small "summon again" button, swapped for the big one after ~7s -->
        <button id="smallButton">SUMMON AGAIN</button>
      </section>
    </main>

    <script type="module" src="trigger.js"></script>
  </body>
</html>
